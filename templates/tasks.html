{% extends 'base.html' %}{% block content %}<div class="title"><div><small>EARN</small><h1>Available tasks</h1></div></div><div class="grid">{% for t in tasks %}<article><small>₦{{t.reward}}</small><h3>{{t.title}}</h3><p>{{t.description}}</p><form method="post" action="/tasks/{{t.id}}/submit/">{% csrf_token %}<textarea name="proof" placeholder="Proof / completion details" required></textarea><button class="btn">Submit proof</button></form></article>{% empty %}<article>No tasks available.</article>{% endfor %}</div>{% endblock %}
